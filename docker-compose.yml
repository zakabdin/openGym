name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset. That dataset is MIT for the
  # metadata and instruction text, but the images and GIFs are © Gym visual
  # (https://gymvisual.com/) and are used under the dataset's terms — openGym neither
  # redistributes nor relicenses them. See NOTICE.md.
  media:
    image: opengym-media:local
    build:
      context: web
      dockerfile: media.Dockerfile
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    environment:
      # Side, in pixels, the downloaded pictures are sharpened to (they ship at 180). 270 by
      # default; 360 is crisper and about twice the bytes; 0 leaves them as downloaded.
      - MEDIA_UPSCALE_PX=${MEDIA_UPSCALE_PX:-270}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          echo "  Source:  github.com/hasaneyldrm/exercises-dataset"
          echo "  Metadata and instruction text: MIT."
          echo "  Images and animations: © Gym visual — https://gymvisual.com/"
          echo "  They are used under that dataset's terms, not openGym's AGPL, and are"
          echo "  downloaded from upstream — openGym does not redistribute them."
          echo "  Terms: https://gymvisual.com/content/3-terms-and-conditions-of-use"
          echo "  Reusing this media yourself, commercially or not, needs your own licence"
          echo "  from Gym visual. Details in NOTICE.md."
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
        # Only files still at the downloaded 180 px are touched, so this is a no-op after the first run.
        upscale-media /out
    restart: "no"

  # PostgreSQL: everything the API stores about people — accounts, passkeys, push subscriptions,
  # invites, training documents, the trainer inbox and the audit log. Reachable only by the api
  # container (no published port). The files are in ./pgdata — BACK THIS UP, or take a dump:
  #     docker compose exec db pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB" > opengym.sql
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-opengym}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-opengym}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # Passkey auth + per-user data (Node, no framework).
  # Built from source (docker compose up --build); no prebuilt registry images.
  api:
    image: opengym-api:local
    # Default target: no AI runtime, no AI dependency — the image every instance has always had.
    # To opt into the AI Coach, build the other target instead:
    #     API_TARGET=coach docker compose up --build api
    # `--build` matters: otherwise compose reuses the already-built default image.
    build:
      context: ./api
      target: ${API_TARGET:-default}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # The image checks every 5 minutes, which is too slow for scripts/deploy.sh to know when a new
    # container is ready. Same probe, tighter timing.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${PORT}/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      # DATABASE_URL comes from .env (see .env.example); it must point at the `db` service above.
      # The port the API listens on. web proxies to this same value, so the two
      # cannot drift — change it in .env and both follow.
      - PORT=${PORT:-3000}
      - DATA_DIR=/data
      # The API is reachable only through the web container here, and that container overwrites
      # X-Forwarded-For / X-Real-IP with the real peer — so the sign-in throttle may count
      # requests by those headers instead of lumping everyone in as "the web container".
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - ./data:/data         # session secret, push keys, uploads/ (photos and videos of custom
                             # exercises) — BACK THIS UP, together with ./pgdata
      # Provider credential cache (Codex). A sibling of ./data on purpose: the documented backup
      # is `tar czf … data/`, and a live refresh token must not end up inside it. Nothing here
      # needs backing up — if you lose it, sign the provider in again.
      - ./coach-auth:/coach-auth

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: opengym-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:$${NGINX_PORT}/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    # nginx renders its config at start-up from these (web/nginx.conf.template),
    # so the API service does not have to be called `api`. Defaults are the old
    # hardcoded values, so an existing .env and an existing stack are unaffected.
    environment:
      - NGINX_PORT=${NGINX_PORT:-80}
      - BACKEND=${BACKEND:-api}
      - PORT=${PORT:-3000}
      # Docker's embedded DNS. Only ever needs changing on a runtime that is not Docker.
      - RESOLVER=${RESOLVER:-127.0.0.11}
      # Empty drops the CF-Connecting-IP header, so a direct client cannot forge the address
      # the activity log records. Cloudflare users set CF_CONNECTING_IP=$$http_cf_connecting_ip.
      - CF_CONNECTING_IP=${CF_CONNECTING_IP:-}
      # Subpath deployments behind a proxy that passes its prefix through ("/gym", no trailing
      # slash). Empty serves the app at the site root, which is what it has always done; a proxy
      # that strips the prefix needs nothing set (docs/SELF_HOSTING.md §5).
      - BASE_PATH=${BASE_PATH:-}
      # Which sites may show the app in a frame (CSP frame-ancestors). 'none' keeps it unframeable;
      # the Telegram Mini App on Telegram Web needs "'self' https://web.telegram.org".
      - FRAME_ANCESTORS=${FRAME_ANCESTORS:-'none'}
      # The largest photo or video upload nginx passes to the API. Keep it above
      # MEDIA_VIDEO_MAX_MB (40 by default), which the api service reads from .env.
      - MEDIA_UPLOAD_MAX=${MEDIA_UPLOAD_MAX:-48m}
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
